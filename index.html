<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png"><meta name="theme-color" content="#ff9cc0"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="單字花園"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>單字花園 · GRE</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff6f0;--panel:#fff;--line:#f1dfe8;--pink:#ff8fb1;--pink2:#ffb0cb;--pinkd:#e2709a;--pinkbg:#fff0f5;--pinkl:#ffd2de;--dot:#ffd9e8;--bg1:#fff3f7;--bg2:#f1ecff;--goldl:#ffd77a;--goldbg:#fffaf0;--gold:#ffb347;--red:#ff6b8b;--green:#3cc497;--blue:#8ab6ff;--lav:#9b7fe6;--txt:#5b4660;--dim:#a08ea8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--txt);font-family:Nunito,"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
html{background:var(--bg2)}
body{background:radial-gradient(var(--dot) 1.6px,transparent 1.7px) 0 0/24px 24px,linear-gradient(180deg,var(--bg1),var(--bg2)) fixed;min-height:100vh}
#app{max-width:480px;margin:0 auto;padding:12px 14px 48px;min-height:100vh;position:relative;overflow-x:hidden}
.serif,.cute{font-family:Fredoka,Nunito,"PingFang TC",system-ui,sans-serif}
button{font:inherit;color:inherit;border:none;cursor:pointer;background:none}
.btn{display:block;width:100%;padding:14px;border-radius:18px;background:#fff;border:2px solid var(--line);box-shadow:0 4px 0 var(--line);font-weight:800;font-size:16px;margin:10px 0;transition:transform .08s,box-shadow .08s}
.btn:active,.opt:active,.door:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn.gold{background:linear-gradient(180deg,var(--pink2),var(--pink));color:#fff;border-color:var(--pink);box-shadow:0 4px 0 var(--pinkd)}
.btn.gold:active{box-shadow:0 1px 0 var(--pinkd)}
.btn.ghost{background:transparent;border:none;box-shadow:none;color:var(--dim);font-weight:600;font-size:14px;padding:8px;margin:4px 0}
.btn:disabled{opacity:.45}
.logo{text-align:center;padding:26px 0 6px}
.logo .t{font-size:62px;font-weight:900;letter-spacing:6px;background:linear-gradient(180deg,var(--pink),#b9a3ff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #fff) drop-shadow(0 6px 10px #ffc9dc)}
.logo .s{color:var(--lav);letter-spacing:2px;font-size:13px;margin-top:2px;font-family:Fredoka,sans-serif;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 12px}
.stat{background:#fff;border:2px solid var(--line);border-radius:18px;padding:10px;text-align:center}
.stat b{display:block;font-size:19px;font-family:Fredoka,Nunito,sans-serif}
.stat span{font-size:11px;color:var(--dim)}
.prog{height:10px;background:#f3e8ff;border-radius:6px;overflow:hidden;margin:6px 0 2px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),#b9a3ff);border-radius:6px}
.small{font-size:12px;color:var(--dim)}
.hud{display:flex;align-items:center;gap:10px}
.hpw{flex:1;position:relative;height:26px;background:#ffe3ea;border-radius:14px;overflow:hidden;border:2px solid #fff;box-shadow:0 2px 6px #f5c9d8}
.hpb{height:100%;background:linear-gradient(90deg,var(--pink),#ffb3c7);border-radius:14px;transition:width .3s}
.hpw span{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:800;color:#7a3b55}
.fl{font-weight:800;color:var(--lav);font-size:15px;white-space:nowrap;font-family:Fredoka,sans-serif}
.ink{font-size:13px;white-space:nowrap;font-weight:700}
.relics{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 2px;min-height:6px}
.relics button{font-size:18px;background:#fff;border:2px solid var(--line);border-radius:12px;width:34px;height:34px}
.enemy{position:relative;text-align:center;padding:4px 0 0}
.critter{position:relative;width:130px;height:112px;margin:0 auto;animation:squish 1.8s ease-in-out infinite;transform-origin:50% 100%}
.critter svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 6px 8px #e3c6dc)}
.critter .hat{position:absolute;top:-8px;right:14px;font-size:30px;transform:rotate(14deg)}
.enemy.boss .critter{width:160px;height:136px}
.enemy.boss .critter .hat{font-size:40px;right:50%;transform:translateX(50%);top:-26px}
.critter.hit{animation:boing .45s}
.critter.cheer{animation:hop .5s 2}
.critter.poof{animation:poof .6s forwards}
@keyframes squish{0%,100%{transform:scale(1,1)}50%{transform:scale(1.06,.93)}}
@keyframes boing{0%{transform:scale(1.3,.7)}40%{transform:scale(.85,1.18)}70%{transform:scale(1.06,.95)}100%{transform:none}}
@keyframes hop{50%{transform:translateY(-14px) scale(.95,1.06)}}
@keyframes poof{30%{transform:scale(1.25,.8)}100%{transform:scale(0) rotate(30deg);opacity:0}}
.ename{font-weight:800;margin-top:2px;font-size:15px}
.ename small{color:var(--dim);font-weight:600;margin-left:6px;font-size:11px}
.ehpw{height:12px;background:#f0e9ff;border-radius:8px;overflow:hidden;max-width:220px;margin:6px auto 2px;border:2px solid #fff;box-shadow:0 2px 5px #e3d8f5}
.ehp{height:100%;background:linear-gradient(90deg,#b9a3ff,#d7c9ff);border-radius:8px;transition:width .35s}
.intent{font-size:12px;color:#e7799a;min-height:16px}
.float{position:absolute;left:50%;top:26px;font-family:Fredoka,sans-serif;font-weight:700;font-size:30px;color:var(--pink);text-shadow:2px 2px 0 #fff,-2px -2px 0 #fff,2px -2px 0 #fff,-2px 2px 0 #fff,0 4px 8px #0002;animation:fl .95s ease-out forwards;pointer-events:none;z-index:5;white-space:nowrap}
.float.crit{color:var(--gold);font-size:42px}
.float.pl{color:var(--red);top:-4px;left:30%}
.float.heal{color:var(--green);top:-4px;left:30%;font-size:22px}
@keyframes fl{0%{opacity:0;transform:translate(-50%,10px) scale(.5)}20%{opacity:1;transform:translate(-50%,-6px) scale(1.25) rotate(-6deg)}100%{opacity:0;transform:translate(-50%,-64px) scale(1)}}
#app.shake{animation:shake .38s}
@keyframes shake{20%{transform:translate(-6px,2px) rotate(-1deg)}40%{transform:translate(5px,-2px) rotate(1deg)}60%{transform:translate(-3px,2px)}80%{transform:translate(2px,-1px)}}
#flash{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle,transparent 45%,var(--pink)55);opacity:0;transition:opacity .3s;z-index:40}
#flash.on{opacity:1;transition:none}
.buddy{display:flex;align-items:flex-end;gap:6px;margin:4px 0 2px;min-height:40px}
.buddy .owl{font-size:32px;line-height:1;animation:sway 3s ease-in-out infinite;transform-origin:50% 100%}
.buddy .bubble{position:relative;background:#fff;border:2px solid var(--line);border-radius:16px 16px 16px 4px;padding:6px 12px;font-size:13px;font-weight:700;color:#7d5f8c;animation:pop .3s}
.buddy.big{justify-content:center;margin:2px 0 4px}
.buddy.big .owl{font-size:44px}
@keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.combo{position:absolute;right:0;top:4px;font-family:Fredoka,sans-serif;font-weight:700;color:var(--pink);font-size:15px;text-align:right;line-height:1.1}
.combo.pop{animation:pop .3s}
.combo.hot{color:#ff9a3c}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.tw{height:9px;background:#f0e9ff;border-radius:6px;overflow:hidden;margin:4px 0}
.tb{height:100%;width:100%;background:#c7b8ff;border-radius:6px}
.tb.crit{background:linear-gradient(90deg,#ffc46b,#ffe08a);box-shadow:0 0 10px #ffd27a}
.tlabel{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);font-weight:700}
.tlabel .c{color:var(--gold)}
.prompt{background:#fff;border:2px solid var(--line);border-radius:22px;padding:14px 16px 16px;margin:8px 0;position:relative;box-shadow:0 6px 18px #ecd7ee}
.ql{font-size:11px;letter-spacing:.5px;color:var(--lav);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;font-weight:800}
.nem{color:#fff;background:var(--pink);border-radius:10px;padding:2px 8px;font-size:11px}
.bigword{font-family:Fredoka,sans-serif;font-size:42px;font-weight:700;text-align:center;line-height:1.1;color:#6b4a8a}
.pos{text-align:center;color:var(--dim);font-size:13px;font-style:italic}
.spk{font-size:18px;vertical-align:middle}
.prompt .sent{font-family:Nunito,system-ui,sans-serif;font-size:18px;line-height:1.6;font-weight:600}
.prompt .sent.en{font-size:16px;color:#6e5a78}
.blank{display:inline-block;min-width:72px;border-bottom:3px dashed var(--pink);height:1.1em;vertical-align:baseline}
.filled{color:var(--green);font-weight:800;border-bottom:3px solid var(--green);padding:0 2px}
.opts{margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}
.opt{display:block;width:100%;text-align:left;padding:12px 14px;margin:8px 0;border-radius:16px;background:#fff;border:2px solid var(--line);box-shadow:0 3px 0 var(--line);font-size:15px;font-weight:700;line-height:1.35;transition:background .15s,border-color .15s,opacity .2s,transform .08s}
.opt .s{display:block;color:var(--dim);font-size:12px;margin-top:3px;font-weight:400}
.opt.w{font-family:Fredoka,sans-serif;font-size:21px;font-weight:600;text-align:center;padding:9px;color:#6b4a8a}
.opt.sel{border-color:#ffc46b;background:#fff6e0;box-shadow:0 3px 0 #ffd99a}
.opt.right{background:#dcf8ec;border-color:var(--green);box-shadow:0 3px 0 #9fe3c7}
.opt.wrong{background:#ffe5ec;border-color:var(--red);box-shadow:0 3px 0 #ffb8c9;animation:shake .3s}
.opt.gone{opacity:.15;pointer-events:none}
.tools{display:flex;gap:8px;margin-top:6px}
.tools button{flex:1;font-size:13px;padding:9px;border-radius:14px;border:2px dashed #d6c8ff;color:var(--lav);font-weight:700;background:#faf7ff}
.hint{font-size:13px;color:var(--lav);margin-top:8px;font-weight:700}
.door{display:flex;gap:14px;align-items:center;padding:14px;border-radius:22px;background:#fff;border:2px solid var(--line);box-shadow:0 4px 0 var(--line);margin:12px 0;width:100%;text-align:left;transition:transform .08s}
.door .ic{font-size:28px;width:52px;height:52px;border-radius:50%;background:var(--pinkbg);display:grid;place-items:center;flex:none}
.door b{display:block;font-size:16px}
.door span{font-size:12px;color:var(--dim)}
.door.boss{border-color:var(--goldl);background:var(--goldbg);box-shadow:0 4px 0 #ffe3a3}
.door.boss .ic{background:#fff0c9}
.door.elite{border-color:#ffc2d4}
.door.elite .ic{background:#ffe3ec}
.floorT{text-align:center;margin:16px 0 4px}
.floorT .n{font-family:Fredoka,sans-serif;font-size:48px;font-weight:700;color:var(--pink)}
.path{display:flex;justify-content:center;gap:5px;margin:6px 0 10px;flex-wrap:wrap}
.path i{width:16px;height:8px;border-radius:4px;background:#eadff0}
.path i.d{background:#c7b8ff}
.path i.c{background:var(--pink)}
.path i.b{width:22px;background:#ffe3a3}
.path i.b.d{background:#ffc46b}
.modal{position:fixed;inset:0;background:#5b466044;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:grid;place-items:center;z-index:50;padding:16px;overflow:auto}
.card{max-width:440px;width:100%;background:#fff;border:3px solid var(--pinkl);border-radius:26px;padding:20px;animation:pop .25s;box-shadow:0 12px 40px #c9a8d055}
.card .cw{font-family:Fredoka,sans-serif;font-size:38px;font-weight:700;line-height:1;color:#6b4a8a}
.card .cp{color:var(--dim);font-size:13px;margin:4px 0 10px}
.card .zh{font-size:20px;font-weight:800;margin-bottom:4px}
.card .en{color:#7d6a86;font-size:14px;margin-bottom:12px}
.card .ex{font-family:Nunito,sans-serif;font-size:16px;font-weight:600;line-height:1.55;background:#fff5f8;border-radius:14px;padding:10px 12px;margin:10px 0}
.card .ex b{color:var(--pink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{background:#f5f0ff;border:2px solid #e8dfff;border-radius:20px;padding:4px 11px;font-size:13px;font-weight:700;color:#7d5f8c}
.chip.r{border-color:var(--pinkl);background:#ffeef3}
.rt{background:#eafaf3;border:2px solid #c6f0dd;border-radius:14px;padding:9px 12px;font-size:13px;color:#2f7a5e;margin-top:10px;font-weight:700}
.stars{color:var(--gold);letter-spacing:2px;font-size:13px}
.banner{text-align:center;font-family:Fredoka,Nunito,sans-serif;font-size:30px;font-weight:700;margin:16px 0 6px;color:var(--pink)}
.banner.bad{color:#a08ea8}
.sub{text-align:center;color:var(--dim);font-size:13px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;margin:6px 0;border-radius:16px;background:#fff;border:2px solid var(--line);width:100%;text-align:left}
.row .w{font-family:Fredoka,sans-serif;font-size:19px;font-weight:600;color:#6b4a8a}
.row .z{font-size:12px;color:var(--dim);display:block}
.tabs{display:flex;gap:6px;margin:10px 0}
.tabs button{flex:1;padding:8px 4px;border-radius:14px;background:#fff;border:2px solid var(--line);font-size:13px;font-weight:700}
.tabs button.on{border-color:var(--pink);color:var(--pink);background:var(--pinkbg)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.top button{color:var(--dim);font-size:14px;padding:6px;font-weight:700}
.upg{display:flex;gap:12px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:20px;padding:12px;margin:10px 0}
.upg .ic{font-size:26px;width:46px;height:46px;border-radius:50%;background:var(--pinkbg);display:grid;place-items:center}
.upg .x{flex:1}
.upg .x b{display:block}
.upg button{padding:9px 12px;border-radius:14px;background:linear-gradient(180deg,var(--pink2),var(--pink));color:#fff;font-weight:800;font-size:13px;white-space:nowrap;box-shadow:0 3px 0 var(--pinkd)}
.upg button:disabled{background:#f1e8f4;color:var(--dim);box-shadow:none}
#toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#fff;border:2px solid var(--pinkl);color:#7d5f8c;font-weight:700;padding:9px 16px;border-radius:20px;font-size:14px;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center;box-shadow:0 6px 18px #e8c6d8}
#toast.on{opacity:1}
.help p{font-size:14px;line-height:1.7;color:#6e5a78;margin:8px 0}
.help b{color:var(--pink)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.gcard{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:20px;padding:12px 14px;margin:10px 0;box-shadow:0 3px 0 var(--line)}
.gcard.done{border-color:var(--goldl);background:var(--goldbg);box-shadow:0 3px 0 #ffe3a3}
.gname{display:flex;justify-content:space-between;font-weight:800;font-size:16px}
.gon{color:var(--gold)}.goff{color:var(--dim);font-size:13px}
.gbonus{font-size:12px;color:var(--dim);margin:3px 0 2px}.gbonus.on{color:#c98a12;font-weight:700}
.gtag{display:block;width:100%;text-align:left;margin-top:10px;background:#f7f2ff;border:2px solid #e3d8ff;border-radius:14px;padding:9px 12px;font-size:13px;font-weight:800;color:var(--lav)}
.room{position:relative;height:250px;border-radius:26px;background:linear-gradient(180deg,#fff7fb 0%,#fdeefe 62%,#f6e2d6 62%,#f3dccd 100%);border:3px solid #fff;box-shadow:0 8px 24px #ead3e6;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.room:before{content:none}
.room:after{content:'🪴';position:absolute;right:16px;bottom:58px;font-size:30px}
.pet{width:190px;height:190px;cursor:pointer;animation:squish 2.2s ease-in-out infinite;transform-origin:50% 100%}
.pet svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 6px 8px #e3c6dc)}
.pet.wob{animation:wobble 2.4s ease-in-out infinite}
.pet.boing{animation:boing .5s}
.pet.small2{width:96px;height:96px;flex:none}
@keyframes wobble{0%,70%,100%{transform:rotate(0)}75%{transform:rotate(-7deg)}80%{transform:rotate(7deg)}85%{transform:rotate(-4deg)}90%{transform:rotate(3deg)}}
.pbubble{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:#fff;border:2px solid var(--line);border-radius:16px;padding:6px 12px;font-size:13px;font-weight:700;color:#7d5f8c;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}
.feedtop{position:relative;display:flex;align-items:center;gap:8px;margin:4px 0}
.fruit{font-size:22px;margin:2px 0}
.owl.mini{width:46px;height:46px;font-size:0}
.owl.mini svg{width:100%;height:100%;overflow:visible}
.elems{display:flex;justify-content:space-around;align-items:flex-end;height:64px;margin:12px 0 4px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:8px}
.elems div{display:flex;flex-direction:column-reverse;align-items:center;height:100%;width:28px;gap:2px}
.elems i{display:block;width:12px;border-radius:6px;min-height:3px}
.elems span{font-size:14px}
.hats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.hatbtn{font-size:28px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:8px 2px}
.hatbtn span{display:block;font-size:11px;color:var(--dim);font-weight:700}
.hatbtn.on{border-color:var(--pink);background:var(--pinkbg)}
.dchip{font-size:11px;font-weight:800;color:#3c9c74;background:#e6f8ef;border:2px solid #c6f0dd;border-radius:10px;padding:2px 7px;white-space:nowrap}
.pbubble{white-space:normal!important;text-align:center;max-width:86%!important}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.tasks{background:#fff;border:2px solid var(--line);border-radius:22px;padding:10px 12px;margin:12px 0 6px;box-shadow:0 4px 0 var(--line)}
.th{font-weight:800;color:var(--pink);margin:2px 2px 4px;display:flex;justify-content:space-between;align-items:center}
.task{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 4px;border-top:2px dashed #f3e6ee}
.task:first-of-type{border-top:none}
.task .ti{font-size:26px;width:38px;text-align:center}
.task .tx{flex:1}.task .tx b{display:block;font-size:15px}.task .tx span{font-size:12px;color:var(--dim)}
.task .tgo{background:linear-gradient(180deg,var(--pink2),var(--pink));color:#fff;font-weight:800;font-size:13px;border-radius:12px;padding:6px 12px;box-shadow:0 3px 0 var(--pinkd)}
.task.done .tgo{background:#f1e8f4;color:var(--dim);box-shadow:none}
.task.done .tx b{color:var(--dim)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 4px}
.grid3 button{background:#fff;border:2px solid var(--line);border-radius:18px;padding:10px 4px;font-size:24px;box-shadow:0 3px 0 var(--line)}
.grid3 button span{display:block;font-size:12px;font-weight:700;color:#7d5f8c;margin-top:2px}
.furn{position:absolute;font-size:30px;z-index:1;pointer-events:none}
.room .pet{z-index:2;position:relative}
.paper{background:repeating-linear-gradient(#fffdf6 0 31px,#f3e3d3 31px 32px);border:2px solid #f1dfc9;border-radius:18px;padding:16px 18px 12px;margin:10px 0;box-shadow:0 6px 16px #ecd9c6;transform:rotate(-.6deg)}
.paper .pp{font-size:14px;line-height:2;color:#8a6e5a}
.paper .sent{line-height:2}
.paper .sign{text-align:right;color:#b08b6e;font-size:13px}
.lens{display:flex;gap:6px;margin:6px 0}
.lens button{flex:1;padding:8px 4px;border-radius:14px;background:#fff;border:2px solid var(--line);font-size:13px;font-weight:800;color:#7d5f8c}
.lens button.on{border-color:var(--pink);color:var(--pink);background:var(--pinkbg)}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:4px 0 8px}

const T3=new Set('abstruse alacrity belie chicanery dilatory diffident enervate exculpate gainsay inchoate ingenuous inveterate mendacious mollify obdurate obsequious obviate paucity pedantic perfunctory precipitate prevaricate prodigal propitiate quiescent recalcitrant recondite soporific stolid taciturn torpor vituperative harangue intractable assiduous castigate intransigent sanction'.split(' '));
const T1=new Set('abate ameliorate anomaly antipathy apathy arduous audacious austere banal bolster burgeon capricious caustic censure cogent complacent corroborate credulous dearth deleterious denigrate diatribe disparate dogmatic eclectic efficacy ephemeral erudite esoteric exacerbate fervent gregarious hackneyed idiosyncratic impetuous laud lethargic lucid magnanimous malleable mitigate volatile verbose vex trite superfluous sporadic prolific placate ostentatious pernicious platitude plethora veracity venerate zealot tirade vacillate intrepid insipid quixotic ebullient iconoclast'.split(' '));
const tierOf=w=>w.t||(T3.has(w.w)?3:T1.has(w.w)?1:2);
function diff(){return save.diff??1}
const BANDS=[[1,'入門','🌱'],[1.6,'普通','🌿'],[2.3,'進階','🌳'],[9,'挑戰','🔥']];
function band(L=diff()){return BANDS.find(b=>L<b[0])}
function adapt(ok,fast){
 const before=band();let L=diff();
 L+=ok?(fast?.07:.05):-.2;L=Math.max(.5,Math.min(3,L));save.diff=L;
 save.recent=(save.recent||[]).concat(ok?1:0).slice(-20);
 const after=band();
 if(after!==before)setTimeout(()=>toast(BANDS.indexOf(after)>BANDS.indexOf(before)?`${after[2]} 難度提升到「${after[1]}」，你變強了！`:`${after[2]} 難度調整為「${after[1]}」，先把基礎打穩`),500);
}
function optCount(kind){const L=diff();let n=L<1?3:L<2?4:5;if(kind&&kind!=='normal')n=Math.min(5,n+1);return n}
function timeMul(){return 1.3-.1*diff()}

function pickWord(){
 run.qn++;
 const due=run.retry.findIndex(r=>r.due<=run.qn);
 if(due>=0){const r=run.retry.splice(due,1)[0];return byW[r.w]}
 const rec=new Set(run.recent.slice(-14));
 const ws=W.filter(w=>!rec.has(w.w)).map(w=>{const m=save.m[w.w];let x=!m?3:m.n?7:Math.max(.35,3.2-m.s*.6);const g=GROUP_OF[w.w];if(g&&!(save.cards&&save.cards[w.w])&&gHave(g)>0)x+=2;const t=1+(diff()-.5)*.8,dt=tierOf(w)-t;x*=(.25+Math.exp(-dt*dt));if(!m&&diff()<1)x*=.5;return[w,x]});
 const w=wpick(ws);run.recent.push(w.w);return w;
}
function distract(t,n,extra=[]){
 const ex=[t,...extra],out=[];
 for(const x of shuffle(W.filter(x=>x.p===t.p&&!ex.some(e=>related(e,x))))){if(out.length>=n)break;if(out.some(o=>related(o,x)))continue;out.push(x)}
 if(out.length<n)for(const x of shuffle(W)){if(out.length>=n)break;if(ex.some(e=>related(e,x))||out.includes(x))continue;out.push(x)}
 return out;
}
function makeQ(w,type,n=4){
 if((type==='tc'||type==='se')&&!w.ex)type='rev';if(type==='se'&&!w.syn.length)type='tc';
 if(type==='se'){const sw=byW[w.syn[0]];const d=distract(w,4,sw?[sw]:[]);return{type,w,need:2,opts:shuffle([{t:w.w,ok:1},{t:w.syn[0],ok:1},...d.map(x=>({t:x.w,ok:0}))])}}
 const d=distract(w,n-1);
 if(type==='def')return{type,w,need:1,opts:shuffle([w,...d]).map(x=>({t:x.zh,s:x.en,ok:x===w?1:0}))};
 return{type,w,need:1,opts:shuffle([w,...d]).map(x=>({t:x.w,ok:x===w?1:0}))};
}
const blankify=s=>esc(s).replace('___','<span class="blank"></span>');
function promptHTML(q){
 const w=q.w,nem=save.m[w.w]&&save.m[w.w].n?'<span class="nem">⚠ 宿敵</span>':'';
 if(q.type==='def')return`<div class="ql"><span>選出正確意思</span>${nem}</div><div class="bigword serif">${w.w} <button class="spk" data-a="say" data-v="${w.w}">🔊</button></div><div class="pos">${w.p}.</div>`;
 if(q.type==='rev')return`<div class="ql"><span>哪個字符合這個定義？</span>${nem}</div><div class="sent en">“${esc(w.en)}”</div>`;
 if(q.type==='tc')return`<div class="ql"><span>填空 · TEXT COMPLETION</span>${nem}</div><div class="sent serif">${blankify(w.ex)}</div>`;
 return`<div class="ql"><span>句子等價 · 選出兩個讓句意相同的字</span>${nem}</div><div class="sent serif">${blankify(w.ex)}</div>`;
}
function optsHTML(q,act){
 const b=q.opts.map((o,i)=>q.type==='def'?`<button class="opt" data-a="${act}" data-v="${i}">${esc(o.t)}<span class="s">${esc(o.s)}</span></button>`:`<button class="opt w" data-a="${act}" data-v="${i}">${esc(o.t)}</button>`).join('');
 return`<div class="opts ${q.need===2?'grid2':''}">${b}</div>`;
}
function revealAnswer(q,sel){
 document.querySelectorAll('.opt').forEach((b,i)=>{const o=q.opts[i];if(o.ok)b.classList.add('right');else if(sel.includes(i))b.classList.add('wrong');b.disabled=true});

function genDoors(f){

 if(f%5===4)out.push('rest');
 while(out.length<3){const t=wpick(pool.filter(p=>!out.includes(p[0])&&p[1]>0));out.push(t)}

 return shuffle(out);

function qType(){
 const k=cb.kind;
 const L=diff(),def=Math.max(.08,.6-.22*(L-.5)),rev=.1+.08*L,tc=.3;
 if(k==='normal')return wpick([['def',def],['tc',tc],['rev',rev],['se',L>=2.2?.15:0]]);
 return wpick([['def',def*.7],['tc',tc],['rev',rev],['se',.15+.06*L]]);
}
function critWin(t){return CRIT_T[t]+(has('serif')?2:0)+(gb('quiet')?1:0)}
function nextQ(){
 const w=pickWord(),type=qType();
 cb.q=makeQ(w,type,optCount(cb.kind));cb.sel=[];cb.locked=false;
 cb.tMax=BASE_T[type]*timeMul()+run.timeBonus+(pe('star')?1.5:0)+(has('glass')?4:0)+(gb('deep')?2:0);

 if(has('quill')&&!cb.quillUsed)tools.push(`<button data-a="quill">✒️ 刪去兩個</button>`);
 if(gb('liar')&&!cb.liarUsed)tools.push(`<button data-a="liar">🎭 刪去一個</button>`);
 if(has('lens')&&!cb.lensUsed)tools.push(`<button data-a="lens">🔍 字根提示</button>`);
 const line=cb.bubble||pick(LINES.start);cb.bubble=null;
 app.innerHTML=hud()+`<div class="enemy ${cb.kind}" id="enemy"><div class="combo ${run.combo>=5?'hot':''}" id="combo">${comboTxt()}</div><div class="critter" id="critter"><div class="body" style="width:100%;height:100%">${critterSVG(cb.color,'idle')}</div><span class="hat">${cb.icon}</span></div><div class="ename">${cb.name}<small>${cb.sub}</small></div>
 <div class="ehpw"><div class="ehp" id="ehp" style="width:${cb.hp/cb.maxHp*100}%"></div></div><div class="small" id="ehpt">${cb.hp} / ${cb.maxHp}</div><div class="intent">${intent}</div></div>

 <div class="tlabel"><span id="tleft"></span><span class="c" id="tcrit">⚡ CRIT</span></div><div class="tw"><div class="tb crit" id="tbar"></div></div>
 <div class="prompt" id="prompt">${promptHTML(q)}<div class="hint" id="hint"></div></div>${optsHTML(q,'opt')}

function comboTxt(){return run.combo>=2?`🔥 ${run.combo} 連擊<br><small>×${comboMul().toFixed(1)}</small>`:''}
function comboMul(){const step=(has('ember')?.2:.1)+(gb('talk')?.05:0)+(pe('wind')?.03:0);return 1+Math.max(0,run.combo-1)*step}
let pausedAt=0;
document.addEventListener('visibilitychange',()=>{if(!cb||cb.locked)return;if(document.hidden)pausedAt=performance.now();else if(pausedAt){cb.t0+=performance.now()-pausedAt;pausedAt=0}});
function startTimer(){
 clearInterval(tmr);let lastSec=99;
 tmr=setInterval(()=>{
  if(document.hidden||!cb||cb.locked)return;
  const el=(performance.now()-cb.t0)/1000,left=cb.tMax-el,bar=$('#tbar');
  if(bar){bar.style.width=Math.max(0,left/cb.tMax*100)+'%';const c=el<critWin(cb.q.type);bar.classList.toggle('crit',c);$('#tcrit').style.visibility=c?'visible':'hidden';$('#tleft').textContent=Math.ceil(Math.max(0,left))+'s'}
  const s=Math.ceil(left);if(left<=3&&s!==lastSec&&s>0){lastSec=s;SFX.tick()}
  if(left<=0){clearInterval(tmr);resolve(false,true)}
 },50);

function choose(i){
 if(!cb||cb.locked)return;const q=cb.q;
 if(q.need===2){
  const k=cb.sel.indexOf(i);if(k>=0)cb.sel.splice(k,1);else cb.sel.push(i);

  if(cb.sel.length<2)return;

 }

}
function resolve(ok,timeout){
 if(cb.locked)return;cb.locked=true;clearInterval(tmr);
 const el=(performance.now()-cb.t0)/1000,q=cb.q,w=q.w;
 const wasNem=save.m[w.w]&&save.m[w.w].n;
 run.total++;save.total++;
 revealAnswer(q,cb.sel);
 if(ok){
  run.correct++;save.correct++;run.combo++;run.maxCombo=Math.max(run.maxCombo,run.combo);
  const crit=el<=critWin(q.type);adapt(true,crit);
  let dmg=20*run.dmgMul*comboMul();if(has('nib'))dmg*=1.25;if(gb('stale'))dmg*=1.12;if(gb('bold'))dmg*=1.1;if(crit)dmg*=(gb('acid')?2.5:2)+(pe('fire')?.3:0);if(wasNem&&has('pact'))dmg*=3;dmg=Math.round(dmg);
  master(w,true);gainCard(w);petXP(1,w);
  cb.hp=Math.max(0,cb.hp-dmg);
  anim($('#critter'),'hit');setFace(cb.hp>0?'hit':'dead',cb.hp>0?450:0);
  floatAt('#enemy',(crit?'✨':'')+dmg,crit?'crit':'');
  buddy(crit?'crit':run.combo>=5?'hot':'ok');
  crit?SFX.crit():SFX.hit();vib(crit?[20,20,40]:20);
  $('#ehp').style.width=cb.hp/cb.maxHp*100+'%';$('#ehpt').textContent=`${cb.hp} / ${cb.maxHp}`;
  const c=$('#combo');if(run.combo>=2){c.innerHTML=comboTxt();c.classList.toggle('hot',run.combo>=5);c.classList.remove('pop');void c.offsetWidth;c.classList.add('pop')}
  if(has('vamp'))heal(3);if(gb('soothe'))heal(2);if(pe('water'))heal(1);if(crit&&has('echo'))heal(5);if(crit&&gb('care'))heal(3);
  persist();
  setTimeout(()=>{if(cb.hp<=0)return winCombat();bossChip(nextQ)},q.type==='tc'||q.type==='se'?1000:700);
 }else{
  master(w,false);adapt(false);if(!run.wrong.includes(w.w))run.wrong.push(w.w);
  run.retry.push({w:w.w,due:run.qn+3});
  let dmg=Math.round(cb.atk*(gb('fickle')?.85:1));
  if(gb('proof')&&!cb.proofUsed){cb.proofUsed=true;dmg=Math.round(dmg/2)}
  if(pe('moon')&&!cb.moonUsed){cb.moonUsed=true;dmg=Math.round(dmg/2)}
  if(has('shield')&&!cb.shieldUsed){cb.shieldUsed=true;dmg=0;toast('🛡️ 同義盾擋下了這次攻擊')}
  if(has('flame')&&!cb.flameUsed&&run.combo>0){cb.flameUsed=true;toast('🕯️ 不滅之火：連擊保留')}else run.combo=0;
  if(timeout)toast('⏰ 時間到');
  if(dmg)hurt(dmg);
  setFace('happy',1300);anim($('#critter'),'cheer');buddy('bad');const cc=$('#combo');if(cc)cc.innerHTML=comboTxt();
  persist();
  setTimeout(()=>learnCard(w,()=>{if(run.hp<=0)return death();bossChip(nextQ)},true),750);
 }
}

async function packSave(){
 const json=JSON.stringify(save);
 try{if(window.CompressionStream){const cs=new Blob([json]).stream().pipeThrough(new CompressionStream('deflate'));const buf=new Uint8Array(await new Response(cs).arrayBuffer());let bin='';for(let i=0;i<buf.length;i+=8192)bin+=String.fromCharCode.apply(null,buf.subarray(i,i+8192));return'WOOF1.'+btoa(bin)}}catch(e){}
 return'WOOF0.'+btoa(unescape(encodeURIComponent(json)));
}
async function unpackSave(code){
 code=String(code||'').trim().replace(/\s+/g,'');
 try{
  if(code.startsWith('WOOF1.')){const bin=atob(code.slice(6)),buf=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)buf[i]=bin.charCodeAt(i);const ds=new Blob([buf]).stream().pipeThrough(new DecompressionStream('deflate'));return JSON.parse(await new Response(ds).text())}
  if(code.startsWith('WOOF0.'))return JSON.parse(decodeURIComponent(escape(atob(code.slice(6)))));
 }catch(e){}
 return null;
}

const czWords=p=>[...p.x.matchAll(CZRE)].map(m=>m[1]);
function czParse(p){const blanks=[],segs=[];let last=0,m;CZRE.lastIndex=0;
 while((m=CZRE.exec(p.x))){segs.push(p.x.slice(last,m.index));segs.push({i:blanks.length});blanks.push({w:m[1],s:m[2],clue:m[3]});last=CZRE.lastIndex}

 return{segs,blanks,opts}}

 for(const k of czWords(p)){if(focus&&focus.has(k)){sc+=6;continue}const m=save.m[k];sc+=m&&m.n?4:m&&m.seen&&(m.due??0)<=t?2:!m||!m.seen?.6:.3}
 const last=(save.cz||{})[p.id];if(last!=null){const ago=t-last;sc*=ago<1?.05:ago<4?.3:ago<10?.7:1}return sc}

function czPick(){const s=CLOZE.map(p=>[p,czScore(p)]).sort((a,b)=>b[1]-a[1]).slice(0,3);return wpick(s.map(x=>[x[0],Math.max(.01,x[1])]))}
